<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Dealer Signup</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6 text-indigo-600">Dealer Registration</h2>
        <form id="signupForm" onsubmit="handleSignup(event)">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">User Name *</label>
                <input type="text" id="username" required class="w-full border p-2 rounded">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Password *</label>
                <input type="password" id="password" required class="w-full border p-2 rounded">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Business Name *</label>
                <input type="text" id="bizName" required class="w-full border p-2 rounded">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Shop Address (Mandatory) *</label>
                <textarea id="shopAddress" required class="w-full border p-2 rounded"></textarea>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium mb-1">Business Logo *</label>
                <input type="file" id="bizLogo" accept="image/*" required class="w-full text-sm">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded font-bold hover:bg-indigo-700">Register Account</button>
        </form>
    </div>

    <script>
        function handleSignup(e) {
            e.preventDefault();
            const logoFile = document.getElementById('bizLogo').files[0];
            const reader = new FileReader();
            
            reader.onloadend = function() {
                const dealerData = {
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value,
                    bizName: document.getElementById('bizName').value,
                    shopAddress: document.getElementById('shopAddress').value,
                    logo: reader.result // Base64 string হিসেবে ইমেজ সেভ হবে
                };
                localStorage.setItem('dealer_account', JSON.stringify(dealerData));
                alert('Registration Successful! Redirecting to login...');
                window.location.href = 'index.html';
            }
            if(logoFile) reader.readAsDataURL(logoFile);
        }
    </script>
</body>
</html>

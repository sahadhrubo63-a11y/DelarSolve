<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Dealer Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6 text-indigo-600">Dealer Portal Login</h2>
        <form onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">User Name</label>
                <input type="text" id="loginUser" required class="w-full border p-2 rounded">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="loginPass" required class="w-full border p-2 rounded">
            </div>
            <div class="flex justify-between items-center mb-6 text-sm">
                <a href="forgot-password.html" class="text-indigo-600 hover:underline">Forgot Password?</a>
                <a href="signup.html" class="text-gray-600 hover:underline">Create Account</a>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white p-2 rounded font-bold hover:bg-indigo-700">Login</button>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const localData = JSON.parse(localStorage.getItem('dealer_account'));
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;

            if(localData && localData.username === u && localData.password === p) {
                sessionStorage.setItem('isLoggedIn', 'true');
                window.location.href = 'dashboard.html';
            } else {
                alert('Invalid Username or Password!');
            }
        }
    </script>
</body>
</html>
